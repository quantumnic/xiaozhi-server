[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaozhi-server"
version = "0.1.0"
description = "Self-hosted backend server for xiaozhi-esp32 devices with OpenAI & Anthropic Claude support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.58.0",
    "anthropic>=0.40.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydub>=0.25.1",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8.0"]
opus = ["opuslib>=3.0.0"]

[tool.setuptools.packages.find]
include = ["xiaozhi*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
